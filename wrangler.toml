name = 'swap-meet-custom-dink-webhook'
main = "src/index.js"
compatibility_date = "2024-11-22"
[observability.logs]
enabled = true

[triggers]
# Cron Triggers run in fixed UTC, no DST awareness, so one entry can't land on
# 9am America/New_York year-round. Two entries bracket both offsets - 14:00 UTC
# covers EST (UTC-5, roughly Nov-Mar) and 13:00 UTC covers EDT (UTC-4, roughly
# Mar-Nov). scheduled() in src/index.js checks the actual Eastern-local hour at
# fire time and skips whichever entry isn't the real 9am for that week.
crons = ["0 14 * * 1", "0 13 * * 1"] # Monday 9am America/New_York (EST or EDT)

[[kv_namespaces]]
binding = "CA_PROGRESS"
id = "cc17ea160ebc4aa390969602aad00259"
preview_id = "508dbfa39b384308b07e3644d57ccad5"

[[d1_databases]]
binding = "PETS_DB"
database_name = "dink_pets"
database_id = "63602ced-0117-4f2b-a525-53d035bc10e2"
migrations_dir = "migrations/pets"

[[d1_databases]]
binding = "CRAB_DB"
database_name = "dink_crab_kc"
database_id = "ae46ffbe-fdd8-45dc-a712-efa039c25c0c"
migrations_dir = "migrations/crab_kc"

[[d1_databases]]
binding = "WEEKLY_RECAP_DB"
database_name = "dink_weekly_recap"
database_id = "c938df6a-ff7a-4954-9ed9-4cfb0782bcb2"
migrations_dir = "migrations/weekly_recap"
